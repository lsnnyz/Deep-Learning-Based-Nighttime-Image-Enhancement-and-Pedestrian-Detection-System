# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8s custom architecture with P2 layer for small object detection (Night Pedestrians)

# Parameters
nc: 1  # 类别数量 (LLVIP 只有 person 一类)
scales: # 使用 YOLOv8s 的缩放比例
  s: [0.33, 0.50, 1024]

# YOLOv8 Backbone (骨干网络 - 提取特征)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]  # 2  <-- P2 高分辨率特征层! (极其重要)
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]  # 4  <-- P3 特征层
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [512, True]]  # 6  <-- P4 特征层
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]]   # 9  <-- P5 特征层

# YOLOv8 Neck & Head with P2 (颈部和头部 - 融合特征并输出)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10: P5 上采样
  - [[-1, 6], 1, Concat, [1]]  # 11: 拼接 P4
  - [-1, 3, C2f, [512]]  # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13: P4 上采样
  - [[-1, 4], 1, Concat, [1]]  # 14: 拼接 P3
  - [-1, 3, C2f, [256]]  # 15: P3 融合层

  # --- 🌟 我们的核心魔改部分：继续上采样，融合 P2 特征 🌟 ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16: P3 再次上采样
  - [[-1, 2], 1, Concat, [1]]  # 17: 拼接 backbone 中的 P2 特征(第2层)
  - [-1, 3, C2f, [128]]  # 18: P2 融合层 (高分辨率小目标检测源)

  # --- 自底向上的下采样通道重构 ---
  - [-1, 1, Conv, [128, 3, 2]] # 19: P2 下采样
  - [[-1, 15], 1, Concat, [1]] # 20: 拼接 15层(P3)
  - [-1, 3, C2f, [256]] # 21: 新 P3 层

  - [-1, 1, Conv, [256, 3, 2]] # 22: P3 下采样
  - [[-1, 12], 1, Concat, [1]] # 23: 拼接 12层(P4)
  - [-1, 3, C2f, [512]] # 24: 新 P4 层

  - [-1, 1, Conv, [512, 3, 2]] # 25: P4 下采样
  - [[-1, 9], 1, Concat, [1]]  # 26: 拼接 9层(P5)
  - [-1, 3, C2f, [1024]] # 27: 新 P5 层

  # --- 🌟 四头检测器 (4 Detect Heads) 🌟 ---
  # 分别在 P2(层18), P3(层21), P4(层24), P5(层27) 上进行目标检测
  - [[18, 21, 24, 27], 1, Detect, [nc]]